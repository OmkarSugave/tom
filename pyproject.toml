[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tom-analytics"
version = "0.1.1"
description = "A one-line autonomous exploratory data analysis (EDA) and reporting library."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "rich",
    "plotly",
    "kaleido",
    "jinja2",
    "tabulate"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tom*"]
