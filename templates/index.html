<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOM Autonomous Analytics Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 29, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-primary: #6366f1;
            --accent-sec: #a855f7;
            --accent-cyan: #06b6d4;
            --green: #10b981;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Glassmorphic Panel */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Drag & Drop Zone */
        .dropzone {
            border: 2px dashed rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            margin-bottom: 30px;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.03);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
            transform: scale(1.01);
        }

        .dropzone.dragover {
            border-style: solid;
        }

        .dropzone-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .dropzone:hover .dropzone-icon, .dropzone.dragover .dropzone-icon {
            transform: translateY(-8px);
        }

        .dropzone-text h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .dropzone-text p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .file-input {
            display: none;
        }

        /* File Preview */
        .file-preview {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 2.2rem;
        }

        .file-name {
            font-weight: 600;
            font-size: 1rem;
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .btn-remove {
            background: none;
            border: none;
            color: var(--red);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }

        .btn-remove:hover {
            transform: scale(1.1);
        }

        /* Button */
        .btn-submit {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            width: 100%;
            letter-spacing: 0.02em;
        }

        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 4px solid rgba(99, 102, 241, 0.1);
            border-left-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        .loading-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .loading-subtext {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Alert notifications */
        .alert {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 15px 25px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
            animation: slideIn 0.3s ease;
        }

        /* Report viewport mode */
        .viewport-container {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            animation: fadeIn 0.6s ease;
        }

        .viewport-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 50;
        }

        .viewport-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .report-iframe {
            flex-grow: 1;
            border: none;
            width: 100%;
            background: var(--bg-color);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Alert Box -->
    <div id="alertBox" class="alert"></div>

    <!-- Portal Mode Container -->
    <div id="portalContainer" class="container">
        <div class="glass-panel">
            
            <!-- Loading Overlay -->
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner"></div>
                <div class="loading-text">Analyzing Dataset...</div>
                <div id="loadingStep" class="loading-subtext">Executing autonomous statistical engine</div>
            </div>

            <!-- Main Panel Header -->
            <header>
                <h1>🚀 TOM Analytics</h1>
                <p>One-Line Autonomous Data Science Diagnostics & EDA Engine</p>
            </header>

            <!-- Drag & Drop Zone -->
            <div id="dropzone" class="dropzone">
                <input type="file" id="fileInput" class="file-input" accept=".csv,.xlsx,.xls,.json,.parquet,.tsv,.txt">
                <span class="dropzone-icon">📂</span>
                <div class="dropzone-text">
                    <h3>Drag & Drop Dataset File</h3>
                    <p>Supports CSV, Excel, Parquet, JSON, TSV, or TXT</p>
                </div>
            </div>

            <!-- File Details Preview -->
            <div id="filePreview" class="file-preview">
                <div class="file-info">
                    <span id="filePreviewIcon" class="file-icon">📄</span>
                    <div>
                        <div id="fileName" class="file-name">filename.csv</div>
                        <div id="fileSize" class="file-size">1.2 MB</div>
                    </div>
                </div>
                <button id="btnRemoveFile" class="btn-remove" title="Remove file">✕</button>
            </div>

            <!-- Run Diagnostics Action Button -->
            <button id="btnSubmit" class="btn-submit" disabled>Run Autonomous Diagnostics</button>

        </div>
    </div>

    <!-- Viewport Mode Container (Iframe Report View) -->
    <div id="viewportContainer" class="viewport-container">
        <div class="viewport-header">
            <span class="viewport-title">📊 Diagnostics Report Viewport</span>
            <button id="btnBackToPortal" class="btn-back">← Back to Portal</button>
        </div>
        <iframe id="reportIframe" class="report-iframe" src=""></iframe>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const filePreview = document.getElementById('filePreview');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const filePreviewIcon = document.getElementById('filePreviewIcon');
        const btnRemoveFile = document.getElementById('btnRemoveFile');
        const btnSubmit = document.getElementById('btnSubmit');
        const portalContainer = document.getElementById('portalContainer');
        const viewportContainer = document.getElementById('viewportContainer');
        const reportIframe = document.getElementById('reportIframe');
        const btnBackToPortal = document.getElementById('btnBackToPortal');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingStep = document.getElementById('loadingStep');
        const alertBox = document.getElementById('alertBox');

        let selectedFile = null;

        const fileIcons = {
            'csv': '📊',
            'xlsx': '💚',
            'xls': '💚',
            'json': '💛',
            'parquet': '🗄️',
            'tsv': '📝',
            'txt': '📝'
        };

        // Standard event helpers
        function showAlert(msg) {
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function handleFileSelection(file) {
            if (!file) return;

            const name = file.name;
            const ext = name.split('.').pop().toLowerCase();

            if (!fileIcons[ext]) {
                showAlert('Unsupported file format! Please upload CSV, Excel, Parquet, JSON, TSV, or TXT.');
                return;
            }

            selectedFile = file;
            fileName.textContent = name;
            fileSize.textContent = formatBytes(file.size);
            filePreviewIcon.textContent = fileIcons[ext] || '📄';

            dropzone.style.display = 'none';
            filePreview.style.display = 'flex';
            btnSubmit.disabled = false;
        }

        // Trigger file input dialog
        dropzone.addEventListener('click', () => fileInput.click());

        // File selection from input dialog
        fileInput.addEventListener('change', (e) => {
            handleFileSelection(e.target.files[0]);
        });

        // Drag & drop handlers
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.remove('dragover');
            }, false);
        });

        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFileSelection(files[0]);
        });

        // Remove active file preview
        btnRemoveFile.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            filePreview.style.display = 'none';
            dropzone.style.display = 'block';
            btnSubmit.disabled = true;
        });

        // Submit form data asynchronously
        btnSubmit.addEventListener('click', () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            // Display loading overlay
            loadingOverlay.style.display = 'flex';
            
            // Loop through progress step simulations to feel premium
            const steps = [
                'Step 1: Renaming duplicates and mapping features...',
                'Step 2: Coercing types and imputing missing variables...',
                'Step 3: Calculating Shapiro-Wilk and Pearson matrices...',
                'Step 4: Compiling high-res visual charts and base64 plots...',
                'Step 5: Renders portable HTML Jinja2 template...'
            ];
            let currentStep = 0;
            const stepInterval = setInterval(() => {
                if (currentStep < steps.length) {
                    loadingStep.textContent = steps[currentStep];
                    currentStep++;
                }
            }, 1500);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => {
                clearInterval(stepInterval);
                if (!res.ok) {
                    return res.json().then(data => { throw new Error(data.error || 'Server processing failure') });
                }
                return res.json();
            })
            .then(data => {
                loadingOverlay.style.display = 'none';
                if (data.success && data.report_url) {
                    // Set iframe source and switch viewport modes
                    reportIframe.src = data.report_url;
                    portalContainer.style.display = 'none';
                    viewportContainer.style.display = 'flex';
                }
            })
            .catch(err => {
                loadingOverlay.style.display = 'none';
                clearInterval(stepInterval);
                showAlert(err.message || 'Failed to upload or analyze the file.');
            });
        });

        // Return back to main portal upload mode
        btnBackToPortal.addEventListener('click', () => {
            viewportContainer.style.display = 'none';
            portalContainer.style.display = 'block';
            reportIframe.src = '';
            
            // Reset fields
            selectedFile = null;
            fileInput.value = '';
            filePreview.style.display = 'none';
            dropzone.style.display = 'block';
            btnSubmit.disabled = true;
        });
    </script>
</body>
</html>
